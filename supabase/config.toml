# 文件用途：定义 Threadline 本地 Supabase 隔离端口与 AI Edge Function 用户认证配置。

project_id = "threadline"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = false

[analytics]
enabled = false

# 智能导入仅解析；网关及函数内部都验证用户 JWT，不允许匿名调用 DeepSeek。
[functions.smart-task-import]
verify_jwt = true

# 账号 API Key 只由此函数加密保存，不向客户端返回密钥。
[functions.ai-api-settings]
verify_jwt = true
