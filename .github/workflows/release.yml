# 文件用途：在版本 tag 或手动发布前验证桌面产物 parity，再构建并发布 Windows NSIS 安装器。
name: Release desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  windows-release-parity:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # parity 只比较同一份静态输入的 Preview/package-dir，使用隔离 adapter，绝不连接生产数据。
      NEXT_PUBLIC_THREADLINE_TEST_ADAPTER: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate version tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF -ne "refs/tags/v$version") { throw 'Select the matching version tag, including for manual runs.' }
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm desktop:verify:parity

  windows-release:
    needs: windows-release-parity
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:release
        env:
          GH_TOKEN: ${{ secrets.THREADLINE_RELEASE_TOKEN }}
          NEXT_PUBLIC_THREADLINE_CLOUD_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
