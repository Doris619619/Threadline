# 文件用途：仅在版本 tag 或手动触发时构建并发布 Windows NSIS 安装器，避免 main CI 承担 GitHub 发布职责。
name: Release desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
