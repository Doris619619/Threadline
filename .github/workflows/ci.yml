# 文件用途：在 pull request 和 main 推送时执行云端、Web/PWA、无云 Preview 演示和 Windows Electron 回归门禁。
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:sql:static
      - run: pnpm supabase:start
      - run: pnpm supabase:lint
      - run: pnpm test:db
      - run: pnpm test:supabase:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:supabase:browser
      - if: always()
        run: pnpm exec supabase stop

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e

  preview-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-demo-results
          path: test-results/

  windows-electron:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_THREADLINE_TEST_ADAPTER: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:electron
      - run: pnpm desktop:build:dir
      - run: pnpm test:electron:packaged
