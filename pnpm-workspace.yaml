# 文件用途：定义 Threadline 的 pnpm 安装布局、受审核构建脚本和兼容安全补丁约束。

nodeLinker: hoisted
storeDir: .pnpm-store

# 仅替换仍落在已公开漏洞范围内的构建间接依赖，保持各自原主版本 API。
overrides:
  'undici@^6': 6.28.1
  'fast-uri@^3': 3.1.8
  'brace-expansion@^2': 2.1.7
  'brace-expansion@^5': 5.0.12
  'http-cache-semantics@^4': 4.3.0

allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@tiptap/core@3.35.1'
  - '@tiptap/extension-blockquote@3.35.1'
  - '@tiptap/extension-bold@3.35.1'
  - '@tiptap/extension-bubble-menu@3.35.1'
  - '@tiptap/extension-bullet-list@3.35.1'
  - '@tiptap/extension-code-block@3.35.1'
  - '@tiptap/extension-code@3.35.1'
  - '@tiptap/extension-document@3.35.1'
  - '@tiptap/extension-dropcursor@3.35.1'
  - '@tiptap/extension-floating-menu@3.35.1'
  - '@tiptap/extension-gapcursor@3.35.1'
  - '@tiptap/extension-hard-break@3.35.1'
  - '@tiptap/extension-heading@3.35.1'
  - '@tiptap/extension-highlight@3.35.1'
  - '@tiptap/extension-horizontal-rule@3.35.1'
  - '@tiptap/extension-italic@3.35.1'
  - '@tiptap/extension-link@3.35.1'
  - '@tiptap/extension-list-item@3.35.1'
  - '@tiptap/extension-list-keymap@3.35.1'
  - '@tiptap/extension-list@3.35.1'
  - '@tiptap/extension-ordered-list@3.35.1'
  - '@tiptap/extension-paragraph@3.35.1'
  - '@tiptap/extension-placeholder@3.35.1'
  - '@tiptap/extension-strike@3.35.1'
  - '@tiptap/extension-text@3.35.1'
  - '@tiptap/extension-underline@3.35.1'
  - '@tiptap/extensions@3.35.1'
  - '@tiptap/markdown@3.35.1'
  - '@tiptap/pm@3.35.1'
  - '@tiptap/react@3.35.1'
  - '@tiptap/starter-kit@3.35.1'
